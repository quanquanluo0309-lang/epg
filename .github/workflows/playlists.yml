name: build-playlists
on:
  schedule:
    - cron: '0 4 * * 1'   # 每周一 UTC 04:00 = 北京时间 12:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playlists
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate upstream sources
        run: |
          python3 scripts/aggregate_sources.py sources.json
          echo "合并池频道数: $(grep -c '^#EXTINF' pool.m3u)"

      - name: Probe all streams
        env:
          PLAYLIST_FILE: pool.m3u
        run: python3 scripts/probe_streams.py

      - name: Assemble curated playlists
        env:
          PLAYLIST_FILE: pool.m3u
        run: python3 scripts/assemble_playlists.py

      - name: Rebuild weekly EPG channel targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          python3 scripts/build_channels.py
          rm -rf grabber
          if ! git diff --quiet channels/; then
            git config user.name "playlist-bot"
            git config user.email "actions@users.noreply.github.com"
            git add channels/
            git commit -m "Weekly EPG channel targets refresh"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "EPG 目标无变化"
          fi

      - name: Publish to lists branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish
          cp "推荐精选·实测可播.m3u" publish/curated.m3u
          cp "全量可播·按国家.m3u" publish/full.m3u
          cp probe_summary.json publish/
          cd publish
          {
            echo "# 实测可播播放列表"
            echo
            echo "每周一北京时间 12:00 自动刷新：聚合 12 个上游源（全球/FAST/国内/港/台）→ URL 去重 → 逐条实测可播性 → 跨源频道合并与影响力排序 → 生成下列两份列表。"
            echo
            echo "- 推荐精选(curated.m3u)：\`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/lists/curated.m3u\`"
            echo "- 全量可播(full.m3u)：\`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/lists/full.m3u\`"
            echo
            echo "最近一次探测结果："
            echo '```json'
            cat probe_summary.json
            echo '```'
            echo
            echo "更新时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
          } > README.md
          git init -b lists
          git config user.name "playlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Playlists refresh $(date -u +%F)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lists
